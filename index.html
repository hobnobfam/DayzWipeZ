<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAYZ WIPE — Community Calendar</title>
<style>
:root{--bg:#080a09;--panel:#111512;--panel2:#171c18;--line:#293029;--text:#edf1ed;--muted:#89928b;--accent:#b7ff3c;--danger:#ff735f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#202b20,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,sans-serif}.wrap{max-width:1220px;margin:auto;padding:24px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border:2px solid var(--accent);display:grid;place-items:center;font-weight:900;color:var(--accent)}h1{font-size:23px;letter-spacing:2px;margin:0}.sub{color:var(--muted)}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}.primary{background:var(--accent);color:#080a08;border-color:var(--accent);font-weight:800}
.hero{margin:22px 0;display:grid;grid-template-columns:1.4fr .6fr;gap:15px}.card{background:rgba(17,21,18,.95);border:1px solid var(--line);border-radius:14px;padding:21px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}.hero h2{font-size:35px;margin:7px 0}.count{font-size:38px;font-weight:900;color:var(--accent)}.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--panel2);border:1px solid var(--line);padding:15px;border-radius:9px}.stat b{display:block;font-size:27px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.toolbar input,.toolbar select,.form input,.form select,.form textarea{background:#0b0e0c;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:8px}.toolbar input{min-width:250px}
.layout{display:grid;grid-template-columns:1.6fr .7fr;gap:15px}.calhead{display:flex;justify-content:space-between;align-items:center}.calnav{display:flex;gap:6px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{color:var(--muted);font-size:11px;padding:9px}.day{min-height:112px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:7px}.day:nth-child(7n){border-right:0}.num{font-weight:800}.today .num{background:var(--accent);color:#080a08;border-radius:50%;display:inline-grid;place-items:center;width:25px;height:25px}.event{margin-top:6px;padding:5px;border-left:3px solid var(--accent);background:#202820;border-radius:4px;font-size:10px;cursor:pointer}.event.map{border-left-color:#ffb84d}.event.econ{border-left-color:#6dbaff}.event small{display:block;color:var(--muted)}
.item{padding:13px 0;border-bottom:1px solid var(--line)}.item strong{display:block}.tag{display:inline-block;font-size:10px;background:#202720;color:#bdc6bd;padding:3px 6px;border-radius:4px;margin-top:5px}.empty{color:var(--muted);text-align:center;padding:35px 10px}
.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:18px;z-index:10}.modal.open{display:grid}.modalbox{width:min(540px,100%);max-height:90vh;overflow:auto}.form{display:grid;gap:10px}.form label{font-size:12px;color:var(--muted)}.form textarea{min-height:80px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.notice{padding:10px;border-radius:7px;background:#202820;color:#cdd5cd}.error{background:#321b18;color:#ffb0a4}
.navlinks{display:flex;gap:7px;align-items:center}
@media(max-width:850px){.hero,.layout{grid-template-columns:1fr}.day{min-height:85px}.event{font-size:9px}}@media(max-width:550px){.wrap{padding:15px 10px}.day{min-height:65px;padding:4px}.event{padding:3px}.event small{display:none}.week div{font-size:9px}.toolbar input{width:100%;min-width:0}}
</style></head>
<body><div class="wrap">
<header><div class="brand"><div class="mark">DZ</div><div><h1>DAYZ WIPE</h1><div class="sub">Community server wipe calendar</div></div></div>
<div class="navlinks"><span id="who" class="muted"></span><button onclick="openModal('login')">Login</button><button class="primary" onclick="openModal('register')">Join community</button></div></header>

<section class="hero"><div class="card"><div class="eyebrow">NEXT COMMUNITY WIPE</div><h2 id="next">Loading…</h2><div id="nextmeta" class="muted"></div><div id="count" class="count">—</div></div>
<div class="card stats"><div class="stat"><b id="serverCount">0</b><span class="muted">servers</span></div><div class="stat"><b id="wipeCount">0</b><span class="muted">upcoming wipes</span></div></div></section>

<div class="toolbar"><input id="q" placeholder="Search servers…" oninput="load()"><select id="platform" onchange="load()"><option value="">All platforms</option><option>PC</option><option>Xbox</option><option>PlayStation</option></select><select id="region" onchange="load()"><option value="">All regions</option><option>EU</option><option>NA</option><option>OCE</option><option>ASIA</option></select><button onclick="openModal('server')">＋ List your server</button></div>

<div class="layout"><section class="card"><div class="calhead"><button onclick="move(-1)">‹</button><h2 id="month"></h2><div class="calnav"><button onclick="today()">Today</button><button onclick="move(1)">›</button></div></div><div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div id="days" class="days"></div></section>
<aside class="card"><h3>Upcoming wipes</h3><div id="upcoming"></div></aside></div>
</div>

<div id="modal" class="modal"><div class="card modalbox"><div id="modalbody"></div></div></div>
<script>
let view=new Date();view.setDate(1);let all=[];let token=localStorage.getItem("dz_token");let me=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const iso=d=>new Date(d).toISOString().slice(0,10);
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(opt.body)opt.headers["Content-Type"]="application/json";let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
async function boot(){if(token){try{me=await api("/api/me");document.getElementById("who").textContent="Signed in as "+me.username}catch{localStorage.removeItem("dz_token");token=null}}load()}
async function load(){let p=new URLSearchParams();if(q.value)p.set("q",q.value);if(platform.value)p.set("platform",platform.value);if(region.value)p.set("region",region.value);try{all=await api("/api/wipes?"+p);render()}catch(e){document.getElementById("days").innerHTML='<div class="empty" style="grid-column:1/-1">Connect the database to load community wipes.</div>'}}
function render(){month.textContent=view.toLocaleString("en-GB",{month:"long",year:"numeric"});days.innerHTML="";let first=new Date(view.getFullYear(),view.getMonth(),1).getDay(),total=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let i=0;i<first;i++)days.appendChild(document.createElement("div"));for(let n=1;n<=total;n++){let d=new Date(view.getFullYear(),view.getMonth(),n),ds=iso(d),c=document.createElement("div");c.className="day";if(ds===iso(new Date()))c.classList.add("today");c.innerHTML=`<span class="num">${n}</span>`;all.filter(w=>w.wipe_date.slice(0,10)===ds).forEach(w=>{let e=document.createElement("div");e.className="event "+(w.wipe_type==="Map Wipe"?"map":w.wipe_type==="Economy Wipe"?"econ":"");e.innerHTML=`<b>${esc(w.name)}</b><small>${esc(w.wipe_type)} · ${esc(w.platform)}</small>`;e.onclick=()=>alert(`${w.name}\n${w.wipe_type}\n${w.platform} · ${w.region}\n${fmt(w.wipe_date)}`);c.appendChild(e)});days.appendChild(c)}let up=all.filter(w=>w.wipe_date.slice(0,10)>=iso(new Date())).sort((a,b)=>a.wipe_date.localeCompare(b.wipe_date));upcoming.innerHTML=up.length?up.slice(0,10).map(w=>`<div class="item"><strong>${esc(w.name)}</strong><div class="muted">${fmt(w.wipe_date)} · ${esc(w.platform)} · ${esc(w.region)}</div><span class="tag">${esc(w.wipe_type)}</span></div>`).join(""):'<div class="empty">No upcoming wipes found.</div>';serverCount.textContent=new Set(all.map(x=>x.server_id)).size;wipeCount.textContent=up.length;let n=up[0];next.textContent=n?n.name:"No upcoming wipes";nextmeta.textContent=n?`${n.wipe_type} · ${n.platform} · ${n.region} · ${fmt(n.wipe_date)}`:"";count.textContent=n?Math.max(0,Math.ceil((new Date(n.wipe_date)-new Date())/86400000))+" days":"—"}
function move(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}function today(){let d=new Date();view=new Date(d.getFullYear(),d.getMonth(),1);render()}
function openModal(type){let body="";if(type==="login")body=`<h2>Log in</h2><div class="form"><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><div id="msg"></div><div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="login()">Log in</button></div></div>`;if(type==="register")body=`<h2>Join the community</h2><div class="form"><label>Username<input id="username"></label><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password" placeholder="8+ characters"></label><div id="msg"></div><div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="register()">Create account</button></div></div>`;if(type==="server")body=`<h2>List your DayZ server</h2>${token?`<div class="form"><label>Server name<input id="sname" placeholder="Salvation DayZ"></label><label>Platform<select id="splatform"><option>PC</option><option>Xbox</option><option>PlayStation</option></select></label><label>Region<select id="sregion"><option>EU</option><option>NA</option><option>OCE</option><option>ASIA</option></select></label><label>Description<textarea id="sdesc"></textarea></label><label>Discord URL<input id="sdiscord"></label><label>Website URL<input id="sweb"></label><div id="msg"></div><div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="addServer()">Submit server</button></div></div>`:`<div class="notice">You need a community account before you can list a server.</div><div class="actions"><button onclick="closeModal()">Close</button><button class="primary" onclick="openModal('register')">Create account</button></div>`}`;modalbody.innerHTML=body;modal.classList.add("open")}
function closeModal(){modal.classList.remove("open")}modal.onclick=e=>{if(e.target===modal)closeModal()}
async function login(){try{let j=await api("/api/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});token=j.token;localStorage.setItem("dz_token",token);closeModal();boot()}catch(e){msg.className="error";msg.textContent=e.message}}
async function register(){try{let j=await api("/api/register",{method:"POST",body:JSON.stringify({username:username.value,email:email.value,password:password.value})});token=j.token;localStorage.setItem("dz_token",token);closeModal();boot()}catch(e){msg.className="error";msg.textContent=e.message}}
async function addServer(){try{let j=await api("/api/servers",{method:"POST",body:JSON.stringify({name:sname.value,platform:splatform.value,region:sregion.value,description:sdesc.value,discord_url:sdiscord.value,website_url:sweb.value})});alert(j.message);closeModal()}catch(e){msg.className="error";msg.textContent=e.message}}
boot();
</script></body></html>
